<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="~{fragments/theme-variables :: theme-vars(${theme})}"></th:block>
</head>
<body>
<main class="page page-narrow">
    <section class="hero">
        <div class="eyebrow">Безопасность</div>
        <h1>Сменить пароль</h1>
        <p class="muted" th:text="'Учётная запись: ' + ${adminUser.login}">Учётная запись</p>
    </section>
    <form class="card stack" method="post" th:action="@{/admin/password/change}">
        <p class="status declined" th:if="${error}" th:text="${error}">Ошибка</p>
        <div class="form-row">
            <label for="currentPassword">Текущий или временный пароль</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required autofocus>
        </div>
        <div class="form-row">
            <label for="newPassword">Новый пароль</label>
            <input id="newPassword" name="newPassword" type="password" minlength="6" autocomplete="new-password" required>
        </div>
        <div class="form-row">
            <label for="confirmPassword">Повторите новый пароль</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit">Сохранить пароль</button>
        <a class="btn secondary" th:href="@{/admin/logout}">Выйти</a>
    </form>
</main>
</body>
</html>
