<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content(activity, guest)">
    <div class="meme-challenge stack">
        <div class="meme-challenge-hero">
            <div>
                <h4 th:text="${activity.instance.config['title']}">Мем-челлендж</h4>
                <p class="muted" th:text="${activity.instance.config['instructions']}">Крути рулетку и повтори выпавший мем.</p>
            </div>
            <button class="meme-spin-button" type="button"
                    th:id="'meme-spin-button-' + ${activity.instance.id}"
                    th:onclick="|drawMeme(this, ${activity.instance.id}, ${guest.id})|">Крутить рулетку</button>
        </div>

        <div th:id="'meme-draw-' + ${activity.instance.id}" class="meme-draw-zone" aria-live="polite"></div>

        <div th:each="result : ${activity.results}"
             th:if="${result.guest.id == guest.id and result.resultData['type'] == 'meme-challenge' and result.resultData['action'] == 'assign'}"
             class="meme-card meme-assignment-card"
             th:style="'--meme-accent:' + ${result.resultData['memeAccent']}">
            <img th:if="${result.resultData['memeImageUrl'] != ''}" th:src="${result.resultData['memeImageUrl']}" th:alt="${result.resultData['memeName']}">
            <div class="meme-card-fallback" th:if="${result.resultData['memeImageUrl'] == ''}">
                <span th:text="${result.resultData['memeEmoji']}">😂</span>
            </div>
            <div class="meme-card-body">
                <span class="meme-task-badge">Тебе выпало</span>
                <span class="meme-region" th:text="${result.resultData['memeRegion']}">US</span>
                <strong th:text="${result.resultData['memeName']}">Meme</strong>
                <p th:text="${result.resultData['memePrompt']}">Prompt</p>
                <small class="muted">Повтори картинку на фото и отметь выполнение ниже.</small>
            </div>
        </div>

        <form class="meme-caption-form" th:onsubmit="|submitMemeCaption(event, ${activity.instance.id}, ${guest.id})|">
            <label th:for="'meme-caption-' + ${activity.instance.id}">Комментарий к фото-повтору</label>
            <div class="meme-caption-row">
                <input th:id="'meme-caption-' + ${activity.instance.id}" name="caption" maxlength="180"
                       placeholder="Например: повторил позу, фото уже в общем чате" required>
                <button class="secondary" type="submit">Отметить выполнение</button>
            </div>
        </form>

        <div class="challenge-gallery stack" th:if="${activity.instance.config['showGallery'] != false}">
            <h4>Повторы гостей</h4>
            <div class="meme-gallery-grid">
                <div class="meme-submission"
                     th:each="result : ${activity.results}"
                     th:if="${result.resultData['type'] == 'meme-challenge' and result.resultData['action'] == 'submit'}"
                     th:style="'--meme-accent:' + ${result.resultData['memeAccent']}">
                    <div class="meme-submission-media">
                        <img th:if="${result.resultData['memeImageUrl'] != ''}" th:src="${result.resultData['memeImageUrl']}" th:alt="${result.resultData['memeName']}">
                        <div class="meme-card-fallback" th:if="${result.resultData['memeImageUrl'] == ''}">
                            <span th:text="${result.resultData['memeEmoji']}">😂</span>
                        </div>
                    </div>
                    <div class="meme-submission-body">
                        <span class="meme-region" th:text="${result.resultData['memeRegion']}">US</span>
                        <strong th:text="${result.resultData['memeName']}">Meme</strong>
                        <p th:text="${result.resultData['caption']}">Caption</p>
                        <div class="meme-submission-actions">
                            <span th:text="${result.guest.name ?: result.guest.label}">Гость</span>
                            <button class="secondary" type="button"
                                    th:if="${activity.instance.config['allowVoting'] and result.guest.id != guest.id}"
                                    th:onclick="|voteChallenge(${activity.instance.id}, ${guest.id}, ${result.id})|">+1</button>
                            <span class="muted" th:if="${result.guest.id == guest.id}">твой</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p class="muted" th:id="'challenge-result-' + ${activity.instance.id}"></p>
    </div>
</th:block>
</html>
