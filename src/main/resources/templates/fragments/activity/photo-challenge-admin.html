<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content(activity)">
    <div class="activity-editor-grid">
        <label>Название в гостевой странице
            <input name="displayName" th:value="${activity.instance.displayName}">
        </label>
        <label>Заголовок мем-челленджа
            <input name="title" th:value="${activity.instance.config['title']}">
        </label>
        <label>Очки за выполнение
            <input name="pointsForCaption" type="number" min="0" th:value="${activity.instance.config['pointsForCaption'] ?: 5}">
        </label>
        <label>Очки за голос
            <input name="pointsForVote" type="number" min="0" th:value="${activity.instance.config['pointsForVote'] ?: 1}">
        </label>
        <label class="activity-editor-wide">Инструкция для гостей
            <input name="instructions" th:value="${activity.instance.config['instructions']}" placeholder="Крути рулетку: тебе выпадет мем-картинка, которую нужно повторить на фото">
        </label>
        <label class="checkbox-line">
            <input name="showGallery" type="checkbox" value="true" th:checked="${activity.instance.config['showGallery'] != false}">
            <span>Показывать галерею готовых мемов</span>
        </label>
        <label class="checkbox-line">
            <input name="allowVoting" type="checkbox" value="true" th:checked="${activity.instance.config['allowVoting'] != false}">
            <span>Разрешить голосование +1</span>
        </label>
    </div>

    <div class="activity-editor-section">
        <div class="activity-editor-heading">
            <strong>Мем-шаблоны</strong>
            <button class="secondary" type="button"
                    th:onclick="|addActivityRow('meme-template-${activity.instance.id}', 'meme-templates-${activity.instance.id}')|">Добавить мем</button>
        </div>
        <p class="muted">Каждый шаблон участвует в рулетке один раз: когда картинка выпала гостю, следующему гостю она уже не выдаётся.</p>
        <div class="activity-row-list meme-admin-list" th:id="'meme-templates-' + ${activity.instance.id}">
            <div class="activity-editor-row meme-editor-row"
                 th:each="meme : ${activity.instance.config['memes']}">
                <input name="memeIds" th:value="${meme['id']}" placeholder="id">
                <input name="memeNames" th:value="${meme['name']}" placeholder="Название мема" required>
                <input name="memeRegions" th:value="${meme['region']}" placeholder="Источник">
                <input name="memeImageUrls" th:value="${meme['imageUrl']}" placeholder="https://...">
                <input name="memePrompts" th:value="${meme['prompt']}" placeholder="Как повторить картинку">
                <input name="memeAccents" type="color" th:value="${meme['accent'] ?: '#ffd166'}">
                <input name="memeEmojis" th:value="${meme['emoji'] ?: '😂'}" maxlength="4" placeholder="😂">
                <button class="ghost danger" type="button" onclick="removeActivityRow(this)">Удалить</button>
            </div>
        </div>
    </div>

    <template th:id="'meme-template-' + ${activity.instance.id}">
        <div class="activity-editor-row meme-editor-row">
            <input name="memeIds" placeholder="id">
            <input name="memeNames" placeholder="Название мема" required>
            <input name="memeRegions" placeholder="Источник">
            <input name="memeImageUrls" placeholder="https://...">
            <input name="memePrompts" placeholder="Как повторить картинку">
            <input name="memeAccents" type="color" value="#ffd166">
            <input name="memeEmojis" value="😂" maxlength="4" placeholder="😂">
            <button class="ghost danger" type="button" onclick="removeActivityRow(this)">Удалить</button>
        </div>
    </template>
</th:block>
</html>
