<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${certificate.resultData['certificateTitle']}">Сертификат</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/activity.css}">
    <th:block th:replace="~{fragments/theme-variables :: theme-vars(${theme})}"></th:block>
</head>
<body class="certificate-page">
<main class="certificate-shell">
    <section class="certificate-paper" th:classappend="${' template-' + certificate.resultData['template']}">
        <span class="certificate-code" th:text="${certificate.resultData['certificateCode']}">CERT</span>
        <div class="certificate-ornament">★</div>
        <p class="section-kicker">Праздничный сертификат</p>
        <h1 th:text="${certificate.resultData['certificateTitle']}">Сертификат</h1>
        <h2 th:text="${certificate.resultData['guestName']}">Гость</h2>
        <p class="certificate-text" th:text="${certificate.resultData['certificateText']}">Текст сертификата</p>
        <p class="muted" th:text="${certificate.resultData['certificateDescription']}">Описание</p>
        <footer>
            <span th:text="${certificate.resultData['eventName']}">Событие</span>
            <span th:text="${certificate.resultData['footerText']}">Спасибо</span>
        </footer>
    </section>
    <div class="certificate-actions no-print">
        <a class="secondary" th:href="@{/invite/{code}/certificates(code=${guest.code})}">Назад</a>
        <button type="button" onclick="printGuestCertificate()">Распечатать / PDF</button>
        <button class="secondary" type="button" onclick="shareGuestCertificate()">Поделиться</button>
    </div>
</main>
<script th:src="@{/js/guest-certificates.js}"></script>
</body>
</html>
