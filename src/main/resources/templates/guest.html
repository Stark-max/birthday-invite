<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" th:content="'Ты приглашён(а) на ДР ' + ${event.name}">
    <meta property="og:description" th:content="${event.message ?: 'Персональное приглашение на день рождения'}">
    <title th:text="'Приглашение для ' + ${guest.label}">Приглашение</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="~{fragments/theme-variables :: theme-vars(${theme})}"></th:block>
</head>
<body>
<main class="page page-narrow">
    <section class="hero animate-in">
        <div class="eyebrow">Приглашение</div>
        <h1 th:text="${guest.label} + ', ты приглашён(а)'">Ты приглашён(а)</h1>
        <h2 th:text="'на день рождения ' + ${event.name}">на день рождения</h2>
        <p class="muted">
            <span th:text="${#temporals.format(event.date, 'dd.MM.yyyy')}">01.01.2026</span>
            <span th:if="${event.time}" th:text="' в ' + ${event.time}"></span>
        </p>
    </section>
    <section class="card stack animate-in">
        <p th:if="${event.message}" th:text="${event.message}">Сообщение</p>
        <form class="stack" method="post" th:action="@{/invite/{code}/respond(code=${guest.code})}">
            <div class="form-row">
                <label for="name">Твоё имя</label>
                <input id="name" name="name" required>
            </div>
            <div class="split">
                <button class="success" type="submit" name="status" value="ACCEPTED">Приду</button>
                <button class="secondary" type="button" onclick="toggleDeclineForm()">Не смогу</button>
            </div>
            <div id="decline-form" class="hidden stack">
                <div class="form-row">
                    <label for="wish">Пожелание</label>
                    <textarea id="wish" name="wish" placeholder="Несколько тёплых слов"></textarea>
                </div>
                <button class="danger" type="submit" name="status" value="DECLINED">Отправить пожелание</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
