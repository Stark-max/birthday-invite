services:
  postgres:
    image: postgres:16
    container_name: birthday-postgres
    environment:
      POSTGRES_DB: birthday_db
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday123
    ports:
      - "5433:5432"
    volumes:
      - birthday_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday -d birthday_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: birthday-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/birthday_db
      SPRING_DATASOURCE_USERNAME: birthday
      SPRING_DATASOURCE_PASSWORD: birthday123
    ports:
      - "8080:8080"

volumes:
  birthday_pg_data:
